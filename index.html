<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuQuery AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 300px;
            background-color: #ffffff;
            border-right: 1px solid #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            color: #2c3e50;
        }

        .upload-box {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background-color: #ebf5fb;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .upload-box:hover {
            background-color: #d4e6f1;
        }

        .upload-box input[type="file"] {
            display: none;
        }

        .doc-list {
            flex-grow: 1;
            overflow-y: auto;
        }

        .doc-item {
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            word-break: break-all;
        }

        /* Main Chat Window Styling */
        .chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #fafafa;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background-color: #3498db;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: #f1f2f6;
            color: #2c3e50;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }

        .chat-input-area input:focus {
            border-color: #3498db;
        }

        .chat-input-area button {
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .chat-input-area button:hover {
            background-color: #2980b9;
        }

        .status-message {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Document Management</h2>
        <div class="upload-box" onclick="document.getElementById('hiddenFileInput').click()">
            <p><strong>Click to Upload PDF</strong></p>
            <span class="status-message" id="uploadStatus">Supports .pdf documents</span>
            <input type="file" id="hiddenFileInput" accept=".pdf" onchange="uploadDocument(event)">
        </div>
        
        <h3>Uploaded Files</h3>
        <div class="doc-list" id="docList">
            <!-- Uploaded filenames will appear here -->
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Chat with your Documents</h2>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">Hello! Upload a PDF to the sidebar and ask me anything about its contents.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask a question about your documents..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function uploadDocument(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadStatus = document.getElementById('uploadStatus');
            const docList = document.getElementById('docList');
            const fileInput = event.target;

            uploadStatus.innerText = 'Uploading & indexing...';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    uploadStatus.innerText = 'Upload successful!';
                    
                    const docItem = document.createElement('div');
                    docItem.className = 'doc-item';
                    docItem.innerText = data.filename || file.name;
                    docList.appendChild(docItem);
                } else {
                    uploadStatus.innerText = 'Error: ' + (data.error || 'Upload failed');
                }
            } catch (error) {
                console.error('Error uploading file:', error);
                uploadStatus.innerText = 'Upload failed.';
            } finally {
                // Reset file input value so re-uploading the same file triggers onchange
                fileInput.value = '';
            }
        }

        async function sendMessage() {
            const inputElement = document.getElementById('userInput');
            const question = inputElement.value.trim();
            if (!question) return;

            const chatMessages = document.getElementById('chatMessages');

            // Append User Message
            const userBubble = document.createElement('div');
            userBubble.className = 'message user';
            userBubble.innerText = question;
            chatMessages.appendChild(userBubble);

            inputElement.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Append Placeholder AI Response
            const aiBubble = document.createElement('div');
            aiBubble.className = 'message ai';
            aiBubble.innerText = 'Thinking...';
            chatMessages.appendChild(aiBubble);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();

                if (response.ok) {
                    aiBubble.innerText = data.answer;
                } else {
                    aiBubble.innerText = 'Error: ' + (data.error || 'Failed to get answer.');
                }
            } catch (error) {
                console.error('Error during chat request:', error);
                aiBubble.innerText = 'Error connecting to the server.';
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
