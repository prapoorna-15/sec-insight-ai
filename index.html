<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEC-Insight AI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background-color: #f9f9fb;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h2 { margin-top: 0; }
    label { font-weight: 600; display: block; margin-top: 12px; }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      margin-top: 18px;
      width: 100%;
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #0052a3; }
    #response {
      margin-top: 20px;
      padding: 12px;
      background: #eef2f6;
      border-left: 4px solid #0066cc;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>SEC-Insight AI — Document Upload</h2>
    <form id="uploadForm">
      <label for="sessionId">Session ID:</label>
      <input type="text" id="sessionId" value="session-1" required>

      <label for="pdfFile">Select PDF Document:</label>
      <input type="file" id="pdfFile" accept="application/pdf" required>

      <button type="submit" id="submitBtn">Upload & Index</button>
    </form>

    <div id="response" style="display:none;"></div>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const responseDiv = document.getElementById('response');
      const submitBtn = document.getElementById('submitBtn');
      
      responseDiv.style.display = 'block';
      responseDiv.innerText = 'Processing document, please wait...';
      submitBtn.disabled = true;

      const formData = new FormData();
      formData.append('sessionId', document.getElementById('sessionId').value);
      formData.append('document', document.getElementById('pdfFile').files[0]);

      try {
        const res = await fetch('/upload-and-index', { method: 'POST', body: formData });
        const data = await res.json();
        responseDiv.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        responseDiv.innerText = 'Error processing upload request.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
